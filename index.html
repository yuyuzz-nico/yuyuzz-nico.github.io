<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nico的小站</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <h1>Nico的小站</h1>
    <p>
      一个在医院做数据分析的人，正在把医疗数据和 AI 工具接起来，顺便学写网页。
    </p>
    <h2>我会什么</h2>
    <ul>
      <li>康复医疗运营与数据分析</li>
      <li>自动化报表与可视化</li>
      <li>AI对话式简易应用开发</li>
    </ul>
    <h2>我在学什么</h2>
    <ul>
      <li>Web 开发（HTML / CSS）</li>
      <li>用 AI 工具做个人工作流</li>
      <li>cs高手的自我修养（双重意义上）</li>
    </ul>
    <img src="assets/guduyaogun.jpg" alt="小孤独坐在沙发上" width="750" />
    <button id="switch-btn">点我试试</button>
    <p id="switch-line">还没被点过。</p>
    <input id="ask-input" placeholder="跟nico说点什么吧" />
    <button id="ask-btn">回话</button>
    <p id="answer-line">（nico还没收到话）</p>
    <h3>参考的网站风格</h3>
    <ul>
      <li><a href="https://seanhalpin.xyz/">Seán Halpin</a></li>
    </ul>
    <script src="assets/script.js"></script>
  </body>
</html>
